name: Notify Issue Closer

permissions:
  issues: write
  contents: read

on:
  issues:
    types: [closed]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
    - name: Send automatic comment on close
      uses: peter-evans/create-or-update-comment@v3
      with:
        issue-number: ${{ github.event.issue.number }}
        body: |
          **Issue résolue !**
          
          Bonjour @${{ github.event.issue.user.login }},
          
          Cette issue a été fermée. Merci pour votre contribution !
          
          _Notification automatique._
